<!DOCTYPE html>
<html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Luyện tập Y học Gia đình (2020–2025)</title>
<style>
:root{--bg:#f6f5f1;--card:#fff;--ink:#1f2328;--mut:#6b6f76;--line:#e3e1da;--acc:#1f6f5c;--acc2:#e7f2ee;--ok:#1d7a3d;--okb:#e6f4ea;--bad:#b3261e;--badb:#fbe9e7;--warn:#9a6700}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
header{background:var(--acc);color:#fff;padding:14px 20px}header h1{margin:0;font-size:18px}header p{margin:2px 0 0;opacity:.85;font-size:13px}
main{max-width:860px;margin:0 auto;padding:18px 14px 80px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:18px;margin-bottom:14px}
h2{font-size:16px;margin:0 0 10px}label.chk{display:flex;gap:8px;align-items:flex-start;padding:5px 0;cursor:pointer;font-size:14.5px}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.pill{border:1px solid var(--line);border-radius:999px;padding:6px 12px;background:#fff;cursor:pointer;font-size:14px}
.pill.on{background:var(--acc);color:#fff;border-color:var(--acc)}
button{font:inherit;border:0;border-radius:8px;padding:10px 16px;cursor:pointer;background:var(--acc);color:#fff}
button.sec{background:#fff;color:var(--ink);border:1px solid var(--line)}button:disabled{opacity:.45;cursor:default}
.meta{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}.tag{font-size:12px;padding:2px 8px;border-radius:6px;background:var(--acc2);color:var(--acc)}
.tag.b1{background:#eef3fb;color:#2456a6}.tag.b2{background:#fdf3e2;color:#9a6700}.tag.b3{background:#f6e9f4;color:#8a2a7a}
.stem{font-weight:600;font-size:16.5px;margin:4px 0 14px}
.opt{display:flex;gap:10px;width:100%;text-align:left;background:#fff;color:var(--ink);border:1.5px solid var(--line);border-radius:10px;padding:11px 13px;margin-bottom:8px;line-height:1.45}
.opt:hover:not(:disabled){border-color:var(--acc)}.opt b{min-width:20px}
.opt.sel{border-color:var(--acc);background:var(--acc2)}.opt.ok{border-color:var(--ok);background:var(--okb)}.opt.bad{border-color:var(--bad);background:var(--badb)}
.opt:disabled{cursor:default;opacity:1}
.exp{border-left:4px solid var(--ok);background:var(--okb);padding:10px 12px;border-radius:6px;margin-top:8px;font-size:14.5px}.exp.no{border-color:var(--bad);background:var(--badb)}
.exams{font-size:12.5px;color:var(--mut);margin-top:10px}
.bar{height:6px;background:var(--line);border-radius:3px;overflow:hidden;margin:6px 0 12px}.bar i{display:block;height:100%;background:var(--acc)}
.nav{display:flex;justify-content:space-between;gap:8px;margin-top:12px}
.grid{display:flex;flex-wrap:wrap;gap:5px;margin-top:10px}.grid span{width:34px;height:30px;display:flex;align-items:center;justify-content:center;border-radius:6px;border:1px solid var(--line);font-size:12.5px;cursor:pointer;background:#fff}
.grid span.cur{outline:2px solid var(--acc)}.grid span.a{background:var(--acc2)}.grid span.ok{background:var(--okb);border-color:var(--ok)}.grid span.bad{background:var(--badb);border-color:var(--bad)}.grid span.flag{box-shadow:inset 0 -3px 0 var(--warn)}
.big{font-size:40px;font-weight:700;color:var(--acc)}.mut{color:var(--mut);font-size:14px}
table{width:100%;border-collapse:collapse;font-size:14px}td,th{padding:6px 8px;border-bottom:1px solid var(--line);text-align:left}
.hide{display:none}.top{display:flex;justify-content:space-between;align-items:center;font-size:14px;color:var(--mut)}
kbd{font-size:11px;border:1px solid var(--line);border-radius:4px;padding:0 4px;background:#fff}
</style></head><body>
<header><h1>Luyện tập Ngân hàng câu hỏi Y học Gia đình (2020–2025)</h1><p>116 câu · 8 chương · phân loại Bloom · ĐHYK Phạm Ngọc Thạch</p></header>
<main>
<section id="setup">
 <div class="card"><h2>1. Chọn chương</h2><div id="chaps"></div>
  <div class="row" style="margin-top:6px"><button class="sec" onclick="allCh(true)">Chọn tất cả</button><button class="sec" onclick="allCh(false)">Bỏ chọn</button></div></div>
 <div class="card"><h2>2. Mức độ Bloom &amp; lọc</h2>
  <div class="row" id="blooms"></div>
  <div class="row" style="margin-top:10px">
   <label class="chk"><input type="checkbox" id="hot"> Chỉ câu "kinh điển" (xuất hiện ≥ 3 đề)</label>
   <label class="chk"><input type="checkbox" id="wrongOnly"> Chỉ câu tôi từng làm sai</label>
  </div></div>
 <div class="card"><h2>3. Chế độ</h2>
  <div class="row" id="modes"></div>
  <div class="row" style="margin-top:10px">
   <label class="chk"><input type="checkbox" id="shufQ" checked> Xáo trộn thứ tự câu</label>
   <label class="chk"><input type="checkbox" id="shufO" checked> Xáo trộn đáp án</label>
   <label class="chk">Số câu: <input type="number" id="limit" min="1" style="width:70px" placeholder="tất cả"></label>
  </div>
  <p class="mut" id="cnt"></p>
  <div class="row"><button onclick="start()">Bắt đầu</button><button class="sec" onclick="resetStats()">Xóa lịch sử làm bài</button></div>
 </div>
 <div class="card" id="statsCard"><h2>Tiến độ của bạn</h2><div id="stats"></div></div>
</section>

<section id="quiz" class="hide">
 <div class="card">
  <div class="top"><span id="pos"></span><span id="score"></span></div>
  <div class="bar"><i id="prog"></i></div>
  <div class="meta" id="meta"></div>
  <div class="stem" id="stem"></div>
  <div id="opts"></div>
  <div id="exp"></div>
  <div class="exams" id="exams"></div>
  <div class="nav"><button class="sec" id="prev" onclick="go(-1)">← Trước</button>
   <span class="row"><button class="sec" id="flagB" onclick="flag()">Đánh dấu</button><button class="sec" onclick="finish()" id="finB">Nộp bài</button></span>
   <button id="next" onclick="go(1)">Tiếp →</button></div>
  <p class="mut" style="margin:10px 0 0">Phím tắt: <kbd>A</kbd>–<kbd>D</kbd> chọn · <kbd>←</kbd><kbd>→</kbd> chuyển câu</p>
 </div>
 <div class="card"><div class="row" style="justify-content:space-between"><b style="font-size:14px">Bảng câu hỏi</b><button class="sec" onclick="quit()">Về màn hình chọn</button></div><div class="grid" id="grid"></div></div>
</section>

<section id="result" class="hide">
 <div class="card" style="text-align:center"><div class="big" id="rs"></div><div class="mut" id="rs2"></div>
  <div class="row" style="justify-content:center;margin-top:14px"><button onclick="reviewWrong()">Làm lại các câu sai</button><button class="sec" onclick="review()">Xem lại toàn bộ</button><button class="sec" onclick="quit()">Về màn hình chọn</button></div></div>
 <div class="card"><h2>Kết quả theo chương</h2><table id="rtab"></table></div>
</section>
</main>
<script>
const DATA={"chapters": {"1": "TỔNG QUAN CHUYÊN NGÀNH Y HỌC GIA ĐÌNH & HỆ THỐNG Y TẾ CÁC NƯỚC", "2": "TỔ CHỨC WONCA, CÂY WONCA (2011) & VAI TRÒ – LỢI ÍCH CỦA Y HỌC GIA ĐÌNH", "3": "SÁU NGUYÊN LÝ Y HỌC GIA ĐÌNH", "4": "CẤU TRÚC VÀ MÔ HÌNH BUỔI KHÁM BỆNH NGOẠI TRÚ", "5": "HỒ SƠ BỆNH ÁN Y HỌC GIA ĐÌNH", "6": "CHĂM SÓC DỰ PHÒNG VÀ TẦM SOÁT TRONG THỰC HÀNH Y HỌC GIA ĐÌNH", "7": "MỐI LIÊN HỆ – PHỐI HỢP BSGĐ VÀ CHUYÊN KHOA & QUẢN LÝ BỆNH MẠN TÍNH (NCDS)", "8": "THAM VẤN VÀ TƯ VẤN SỨC KHỎE TRONG Y HỌC GIA ĐÌNH"}, "qs": [{"n": 1, "ch": 1, "bloom": "Nhớ", "exam": "CK Y19CD (2023) • CK Y18CD (2023) • CK YVĐ17 (2022) • CK Y17 (2022) • CK Y16 (2021) • CK Y15 Ca 2 (2020)", "stem": "Lĩnh vực hoạt động của Y học gia đình tập trung chủ yếu về (chọn câu ĐÚNG NHẤT):", "opts": {"A": "Khám chữa bệnh tại nhà cho bệnh nhân theo yêu cầu.", "B": "Chăm sóc sức khỏe theo hướng dự phòng đơn thuần hoặc Y tế công cộng.", "C": "Khám kế hoạch hóa gia đình hoặc khám sàng lọc nội trú tại bệnh viện.", "D": "Khám chữa bệnh ngoại trú đa khoa tổng quát."}, "ans": "D", "exp": "Y học gia đình là chuyên khoa lâm sàng hướng chăm sóc ban đầu, tập trung chủ yếu vào khám chữa bệnh ngoại trú đa khoa tổng quát."}, {"n": 2, "ch": 1, "bloom": "Nhớ", "exam": "CK Y20CD (2024)", "stem": "Phòng khám Bác sĩ gia đình tại Việt Nam nên được đặt ở đâu, chọn câu ĐÚNG NHẤT:", "opts": {"A": "Trạm y tế xã/phường, phòng khám đa khoa tư nhân, khoa khám bệnh bệnh viện quận/huyện.", "B": "Trung tâm xét nghiệm, phòng khám đa khoa tư nhân, bệnh viện quận.", "C": "Bệnh viện đa khoa tuyến trung ương, phòng khám đa khoa tư nhân, bệnh viện quận.", "D": "Bệnh viện đa khoa tuyến tỉnh, phòng khám đa khoa tư nhân, bệnh viện quận."}, "ans": "A", "exp": "Theo Đề án 935/QĐ-BYT và Thông tư 21/2019/TT-BYT, cơ sở YHGĐ gắn liền với mạng lưới y tế cơ sở: trạm y tế tuyến xã/phường, phòng khám BSGĐ tư nhân/đa khoa và phòng khám thuộc BV quận/huyện."}, {"n": 3, "ch": 1, "bloom": "Nhớ", "exam": "CK Y21CD (2025)", "stem": "Ở mô hình hệ thống y tế của Anh (NHS), để bệnh nhân được chuyển lên tuyến 2, tuyến 3 cần điều kiện gì?", "opts": {"A": "Cần thư giới thiệu (chuyển tuyến bắt buộc) của Bác sĩ gia đình.", "B": "Bệnh nhân phải tự chi trả toàn bộ viện phí.", "C": "Chỉ áp dụng cho đối tượng người già.", "D": "Bệnh nhân tự do đăng ký khám thẳng ở bất kỳ bệnh viện tuyến cuối nào."}, "ans": "A", "exp": "Mô hình của Anh (Bài 1, Slide 24): Bảo hiểm y tế toàn dân do nhà nước chi trả theo đầu dân quản lý (1.500–2.000 BN/BSGĐ có ràng buộc), áp dụng mô hình y tế phân tuyến bắt buộc (phải có thư giới thiệu của BSGĐ khi lên tuyến 2, 3)."}, {"n": 4, "ch": 1, "bloom": "Hiểu", "exam": "CK Y21CD (2025)", "stem": "Sự phân chia hệ thống y tế thành Tuyến 1, Tuyến 2, Tuyến 3 (theo báo cáo Lord Dawson năm 1920) dựa trên tiêu chí nào?", "opts": {"A": "Theo đặc thù nhu cầu sức khỏe và mức độ phức tạp bệnh lý của từng tuyến.", "B": "Theo địa giới cấp hành chính: xã – huyện – tỉnh.", "C": "Theo cấp bậc quản lý: tuyến trên lãnh đạo tuyến dưới.", "D": "Theo mức thu nhập và khả năng chi trả của người bệnh."}, "ans": "A", "exp": "Báo cáo Lord Dawson (1920) phân chia 3 tuyến dựa trên đặc thù vấn đề sức khỏe: Tuyến 1 (BS tổng quát/BSGĐ giải quyết các bệnh thông thường, phổ biến), Tuyến 2 (bệnh phức tạp hơn), Tuyến 3 (bệnh phức tạp, hiếm gặp cần kỹ thuật cao + giảng dạy)."}, {"n": 5, "ch": 1, "bloom": "Hiểu", "exam": "CK Y21CD (2025)", "stem": "Dựa vào mô hình hệ thống y tế 3 tuyến, để giải quyết căn cơ vấn đề quá tải bệnh viện tuyến trên tại Việt Nam cần áp dụng giải pháp nào?", "opts": {"A": "Trả lại hình ảnh đúng cho tuyến y tế cơ sở (chất lượng cao, điều trị toàn diện), đầu tư trang thiết bị phù hợp và đào tạo BSGĐ.", "B": "Chuyển tất cả bác sĩ từ bệnh viện tuyến trên về công tác tại trạm y tế xã.", "C": "Giới hạn chỉ cho phép trạm y tế làm công tác tiêm chủng và dự phòng, không điều trị.", "D": "Tập trung toàn bộ ngân sách mở rộng thêm giường bệnh tại các bệnh viện tuyến cuối."}, "ans": "A", "exp": "Bài 1 (Slide 11–20): Quá tải bệnh viện là hệ quả của tuyến y tế ban đầu yếu và định kiến lịch sử coi tuyến đầu chỉ dự phòng, chất lượng thấp. Cần xác định lại hình ảnh tuyến ban đầu: trình độ chuyên khoa cao (BSGĐ), trang bị phù hợp địa phương, kết hợp dự phòng – chẩn đoán – điều trị."}, {"n": 6, "ch": 1, "bloom": "Hiểu", "exam": "CK Y19CD (2023)", "stem": "Đặc điểm của Bác sĩ gia đình và tuyến y tế ban đầu là gì, NGOẠI TRỪ:", "opts": {"A": "Tiếp cận hướng cộng đồng, chỉ làm dự phòng chứ không điều trị bệnh.", "B": "Giải quyết phần lớn các nhu cầu sức khỏe ban đầu thường gặp ở giai đoạn sớm.", "C": "Chăm sóc toàn diện, liên tục cho cá nhân và gia đình.", "D": "Là điểm tiếp xúc đầu tiên của người dân với hệ thống y tế."}, "ans": "A", "exp": "Quan niệm 'Tuyến y tế ban đầu chỉ dự phòng, không điều trị' là quan niệm SAI LẦM (Slide 11 Bài 1). BSGĐ vừa dự phòng, vừa chẩn đoán, điều trị và theo dõi liên tục."}, {"n": 7, "ch": 2, "bloom": "Nhớ", "exam": "CK YVĐ17 (2022) • CK Y17 (2022) • CK Y16 (2021)", "stem": "Chữ WONCA là chữ viết tắt của cụm từ tiếng Anh nào sau đây?", "opts": {"A": "World Organization of Nurse Colleges Academies.", "B": "World Organization of National Colleges Academy.", "C": "World Organization of National Colleges Academies (and Academic Associations of General Practitioners/Family Physicians).", "D": "World Organization of National Care Academies."}, "ans": "C", "exp": "WONCA (thành lập năm 1972) là viết tắt của World Organization of National Colleges, Academies (and Academic Associations of General Practitioners/Family Physicians) – Tổ chức Bác sĩ Gia đình Thế giới."}, {"n": 8, "ch": 2, "bloom": "Nhớ", "exam": "CK Y21CD (2025)", "stem": "Trong mô hình cây WONCA (2011) có bao nhiêu đặc trưng của chuyên ngành YHGĐ (tương ứng với số chiếc lá trên tán cây)?", "opts": {"A": "12 đặc trưng (12 chiếc lá).", "B": "15 đặc trưng.", "C": "6 đặc trưng.", "D": "3 đặc trưng."}, "ans": "A", "exp": "Bài 9 (Slide 37): Cây WONCA gồm 3 năng lực nền tảng ở thân cây, 6 nhóm kỹ năng chính (6 nhánh cành) và 12 đặc trưng tương ứng với 12 chiếc lá trên tán cây."}, {"n": 9, "ch": 2, "bloom": "Nhớ", "exam": "CK Y16 (2021) • CK Y15 Ca 1 (2020) • CK Y15 Ca 2 (2020)", "stem": "Ba kỹ năng (năng lực) nền tảng ở phần THÂN CÂY WONCA cần có của Bác sĩ gia đình bao gồm các yếu tố sau, NGOẠI TRỪ:", "opts": {"A": "Chuyên môn / Thực hành lâm sàng (Clinical expertise).", "B": "Giao tiếp có hiệu quả với người bệnh (Doctor–patient communication).", "C": "Quản lý công việc / Quản lý ngoại trú (Practice management).", "D": "Hoạt động nghiên cứu lâm sàng chuyên môn."}, "ans": "D", "exp": "Thân cây WONCA có 3 năng lực cốt lõi: (1) Chuyên môn lâm sàng, (2) Giao tiếp người bệnh, (3) Quản lý công việc (nền tảng bên dưới là Thái độ – Khoa học – Bối cảnh). 'Nghiên cứu lâm sàng' không thuộc 3 kỹ năng thân cây."}, {"n": 10, "ch": 2, "bloom": "Nhớ", "exam": "CK Y20CD (2024) • CK YVĐ17 (2022)", "stem": "Cây WONCA thể hiện 6 nhóm kỹ năng chính (6 nhánh cành) bao gồm các ý sau, NGOẠI TRỪ:", "opts": {"A": "Hướng về gia đình (Family-based care).", "B": "Hướng về cộng đồng (Community orientation).", "C": "Chăm sóc hướng bệnh nhân (Person-centred care).", "D": "Các kỹ năng giải quyết vấn đề chuyên biệt (Specific problem-solving skills)."}, "ans": "A", "exp": "6 nhánh của cây WONCA (Slide 36 Bài 9) gồm: (1) Quản lý chăm sóc ban đầu, (2) Chăm sóc hướng bệnh nhân, (3) Kỹ năng giải quyết vấn đề chuyên biệt, (4) Tiếp cận tổng thể, (5) Hướng về cộng đồng, (6) Mô hình chăm sóc toàn diện. ('Hướng gia đình' nằm trong 6 nguyên lý YHGĐ chứ không phải tên 1 trong 6 nhánh cây WONCA)."}, {"n": 11, "ch": 2, "bloom": "Nhớ", "exam": "CK Y20CD (2024) • CK YVĐ17 (2022) • CK Y17 (2022) • CK Y16 (2021)", "stem": "Cây WONCA thể hiện 6 nhóm kỹ năng chính bao gồm các ý sau, NGOẠI TRỪ:", "opts": {"A": "Quản lý chăm sóc sức khỏe ban đầu.", "B": "Tiếp cận một cách tổng thể.", "C": "Kỹ năng giải quyết vấn đề chuyên khoa sâu (hoặc tiếp cận các cơ quan một cách chuyên biệt).", "D": "Mô hình chăm sóc toàn diện."}, "ans": "C", "exp": "Nhánh th rne và Long (1976) phân loại buổi khám thành một dải quang phổ liên tục từ lấy bác sĩ làm trung tâm (doctor-centered) sang lấy bệnh nhân làm trung tâm (patient-centered) với nhiều mức độ tương tác (Bác sĩ > Bác sĩ – Bệnh nhân > Bệnh nhân), không phải chỉ có 2 thang độ cứng nhắc."}, {"n": 39, "ch": 4, "bloom": "Hiểu", "exam": "CK Y20CD (2024)", "stem": "Nói về mô hình 6 hình thức phân tích can thiệp (John Heron, 1975), CHỌN CÂU SAI:", "opts": {"A": "Mô hình dựa trên sự tham gia của bệnh nhân và sự can thiệp của bác sĩ.", "B": "3 hình thức đầu (nhóm Quyền uy): Chỉ thị – Thông tin – Thương thảo.", "C": "3 hình thức sau (nhóm Tạo thuận lợi): Khuyến khích – Xúc tác – Hỗ trợ.", "D": "Sắp xếp theo thứ tự giảm dần mức độ tham gia của bệnh nhân."}, "ans": "D", "exp": "Từ Chỉ thị -> Thông tin -> Thương thảo -> Khuyến khích -> Xúc tác -> Hỗ trợ là thứ tự TĂNG DẦN mức độ tham gia chủ động của bệnh nhân (và giảm dần sự áp đặt của bác sĩ). Do đó nói 'giảm dần mức độ tham gia của BN' là SAI."}, {"n": 40, "ch": 4, "bloom": "Hiểu", "exam": "CK Y19CD (2023) • CK Y18CD (2023)", "stem": "Đối với việc áp dụng các mô hình khám bệnh trong thực hành Y học gia đình, ý nào sau đây là CHƯA CHÍNH XÁC?", "opts": {"A": "Mỗi mô hình khám bệnh phục vụ một mục đích cụ thể.", "B": "Mỗi mô hình đều có ưu điểm và khuyết điểm riêng.", "C": "Chúng ta bắt buộc phải vận dụng tất cả các mô hình cùng một lúc trong một buổi khám.", "D": "Việc lựa chọn mô hình khám bệnh là linh hoạt tùy theo tình huống và bệnh nhân."}, "ans": "C", "exp": "Bác sĩ lựa chọn và phối hợp mô hình một cách linh hoạt tùy bối cảnh, không bắt buộc phải áp dụng tất cả các mô hình cùng lúc."}, {"n": 41, "ch": 4, "bloom": "Hiểu", "exam": "CK Y20CD (2024) • CK YVĐ17 (2022) • CK Y15 Ca 1 & Ca 2 (2020)", "stem": "Các hướng dẫn sau đây phù hợp để khai thác BỆNH SỬ hiệu quả, NGOẠI TRỪ (CHỌN CÂU SAI):", "opts": {"A": "Sử dụng câu hỏi chung chung để nhận biết rõ triệu chứng đặc hiệu của bệnh nhân (hoặc chỉ cần khai thác bệnh sử ở lần khám đầu ti ơng cơ quan đích (và các yếu tố nguy cơ tim mạch) và quyết định hướng điều trị dựa theo kết quả đánh giá.", "B": "Dùng thuốc hạ áp ngậm dưới lưỡi hạ áp thật nhanh vì sợ xuất huyết não.", "C": "Chỉ tư vấn thay đổi lối sống và hẹn tái khám sau 3 tháng.", "D": "Từ chối khám và yêu cầu bệnh nhân tự đi bệnh viện tuyến cuối."}, "ans": "A", "exp": "Khi HA >= 180/100 mmHg (THA độ 3) kèm nhức đầu, bước quan trọng đầu tiên là đánh giá xem có tổn thương cơ quan đích cấp tính (cơn THA cấp cứu vs. khẩn trương) hay không để quyết định hướng xử trí an toàn."}, {"n": 101, "ch": 7, "bloom": "Vận dụng", "exam": "CK Y17 (2022) • CK Y16 (2021) • CK Y15 Ca 1 & Ca 2 (2020)", "stem": "Mục tiêu khi Bác sĩ gia đình tư vấn thay đổi lối sống cho bệnh nhân Tăng huyết áp bao gồm các nội dung sau, NGOẠI TRỪ:", "opts": {"A": "Ngưng hút thuốc lá và hạn chế rượu bia.", "B": "Nghỉ ngơi tuyệt đối, hạn chế vận động thể lực (hoặc Thay đổi thuốc điều trị liên tục).", "C": "Giảm cân hợp lý nếu thừa cân, béo phì.", "D": "Giảm lượng muối ăn hằng ngày (< 5–6g muối/ngày)."}, "ans": "B", "exp": "Bệnh nhân THA được khuyến khích vận động thể lực mức độ trung bình đều đặn (30 phút/ngày, ít nhất 5 ngày/tuần), KHÔNG phải 'nghỉ ngơi, giảm hoạt động thể lực' hay 'thay đổi thuốc liên tục'."}, {"n": 102, "ch": 7, "bloom": "Vận dụng", "exam": "CK Y15 Ca 1 & Ca 2 (2020)", "stem": "Việc điều trị bệnh nhân Tăng huyết áp kèm Đái tháo đường cần hướng đến các mục tiêu sau, NGOẠI TRỪ:", "opts": {"A": "Đưa đường huyết sau ăn xuống < 4 mmol/L (< 72 mg/dL).", "B": "Kiểm soát đạm niệu (Albumin niệu) < 300 mg/ngày.", "C": "Kiểm soát chỉ số HbA1c đạt mục tiêu (< 7% hoặc < 7,5% tùy cá thể).", "D": "Kiểm soát huyết áp mục tiêu < 130/80 – 130/85 mmHg."}, "ans": "A", "exp": "Đường huyết sau ăn < 4 mmol/L là ngưỡng HẠ ĐƯỜNG HUYẾT nguy hiểm! Mục tiêu đường huyết 1–2 giờ sau ăn ở bệnh nhân ĐTĐ là < 10 mmol/L (< 180 mg/dL)."}, {"n": 103, "ch": 7, "bloom": "Vận dụng", "exam": "CK Y19CD (2023) • CK Y18CD (2023)", "stem": "[Chùm câu hỏi tình  $('stats').innerHTML=`<table><tr><th>Chương</th><th>Đã làm</th><th>Lần gần nhất đúng</th><th>Lần gần nhất sai</th></tr>${rows}</table>`}
document.addEventListener('keydown',e=>{if($('quiz').classList.contains('hide')||e.target.tagName==='INPUT')return;const k=e.key.toUpperCase();if('ABCD'.includes(k)&&k.length===1)pick('ABCD'.indexOf(k));else if(e.key==='ArrowRight')go(1);else if(e.key==='ArrowLeft')go(-1)});
draw();
</script></body></html>
